[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marpelle"
version = "0.1.0"
description = "Manifest-driven local service framework for Nuitka-built Python apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marpelle Contributors" }]
dependencies = [
  "lmdb>=1.4.1",
  "PyYAML>=6.0.1",
  "lupa>=2.0",
  "python-daemon>=3.1.2",
  "termcolors>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
marpelle = "marpelle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
